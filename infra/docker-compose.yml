# O Vilao — infraestrutura de desenvolvimento (Zero-Supabase).
# PostgreSQL 16 nativo + Redis 7. Ollama e opcional (perfil "ai").
# Porta do host do Postgres e configuravel via POSTGRES_HOST_PORT (default 5432).
name: vilao

services:
  postgres:
    image: postgres:16-alpine
    container_name: vilao_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vilao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vilao}
      POSTGRES_DB: ${POSTGRES_DB:-vilao}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - vilao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vilao}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vilao_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes:
      - vilao_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: vilao_ollama
    profiles: ["ai"]
    ports: ["11434:11434"]
    volumes:
      - vilao_ollama:/root/.ollama

volumes:
  vilao_pgdata:
  vilao_redisdata:
  vilao_ollama:
